[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vic-rag"
version = "0.1.0"
description = "Universal, model-agnostic RAG engine with industry knowledge packs (foreign trade, logistics, AI one-person company, social media). MCP + HTTP + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vic"}]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1.1"]
local-embed = ["fastembed>=0.3"]
all = ["mcp>=1.2", "pypdf>=4", "python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
vic-rag = "vic_rag.cli:main"

[tool.setuptools.packages.find]
include = ["vic_rag*"]
